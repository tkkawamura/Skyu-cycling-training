name: Keep Streamlit app awake

on:
  schedule:
    # Every 2 hours, all day. GitHub delays scheduled runs by up to several hours,
    # so frequent visits keep the app from ever falling asleep.
    - cron: "17 */2 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Wake the app
        run: python scripts/wake_streamlit.py
